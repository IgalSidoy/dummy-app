name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (standalone)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

  docker-build-push:
    name: Docker build & push (Fly)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Snapshot fly-action's OIDC docker credentials
        # jfrog/fly-action@v1 writes an OIDC-issued credential into
        # ~/.docker/config.json. We copy it aside so the scoped-token login
        # below can override the active config for the `FROM` pull without
        # losing the OIDC creds we still need for the push.
        run: |
          mkdir -p "${HOME}/.docker"
          if [ -f "${HOME}/.docker/config.json" ]; then
            cp "${HOME}/.docker/config.json" /tmp/docker-config.oidc.json
          else
            echo "::warning::fly-action did not produce ~/.docker/config.json — the push step will fail unless OIDC creds are recreated."
            echo '{}' > /tmp/docker-config.oidc.json
          fi

      - name: Log in to Fly registry with prod-github scoped token
        # Overrides the OIDC-issued docker credential so the `FROM` pull in
        # the build step below runs under the narrower scope of the
        # prod-github runtime-environment access token. The push step
        # afterwards restores OIDC creds because the scoped token does not
        # have deploy/write permission on the docker repo.
        #
        # PROD_DOCKER_USERNAME is the "docker-username" value shown alongside
        # the token in Fly Web's token-creation dialog (stored as a secret so
        # the email/identity stays out of the public workflow YAML).
        env:
          FLY_PROD_GITHUB_TOKEN: ${{ secrets.FLY_PROD_GITHUB_TOKEN }}
          FLY_PROD_GITHUB_USERNAME: ${{ secrets.PROD_DOCKER_USERNAME }}
        run: |
          if [ -z "${FLY_PROD_GITHUB_TOKEN}" ]; then
            echo "::error::FLY_PROD_GITHUB_TOKEN secret is not set on this repo."
            exit 1
          fi
          if [ -z "${FLY_PROD_GITHUB_USERNAME}" ]; then
            echo "::error::PROD_DOCKER_USERNAME secret is not set on this repo."
            exit 1
          fi
          printf '%s' "${FLY_PROD_GITHUB_TOKEN}" | docker login \
            "${FLY_REGISTRY_SUBDOMAIN}" \
            --username "${FLY_PROD_GITHUB_USERNAME}" \
            --password-stdin

      - name: Resolve image tags
        id: tags
        run: |
          # Docker image names must be lowercase; github.repository preserves
          # the owner's case (IgalSidoy/dummy-app -> igalsidoy/dummy-app).
          REPO_LC="${IMAGE_NAME,,}"
          BASE="${FLY_REGISTRY_SUBDOMAIN}/docker/${REPO_LC}"
          echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${BASE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image (FROM pulled under prod-github scope)
        run: |
          docker build \
            --file Dockerfile \
            --tag "${{ steps.tags.outputs.latest }}" \
            --tag "${{ steps.tags.outputs.sha }}" \
            --build-arg "NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}" \
            .

      - name: Restore OIDC docker credentials for push
        # Swap the scoped-token credential back out for the OIDC credential
        # fly-action created at job start, since the prod-github token has
        # no deploy/write permission on the docker repo.
        run: |
          cp /tmp/docker-config.oidc.json "${HOME}/.docker/config.json"

      - name: Push image (under fly-action OIDC)
        run: |
          docker push "${{ steps.tags.outputs.latest }}"
          docker push "${{ steps.tags.outputs.sha }}"

  publish-readme:
    name: Publish README to Fly (public)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Upload README as generic artifact
        uses: jfrog/fly-action/upload@v1
        with:
          name: dummy-app-readme
          version: ${{ github.sha }}
          files: |
            README.md

      - name: Make README publicly downloadable
        uses: jfrog/fly-action/distribute@v1
        with:
          name: dummy-app-readme
          version: ${{ github.sha }}
          type: generic

      - name: Print public download URLs
        run: |
          echo "Versioned: ${FLY_URL}/public/generic/dummy-app-readme/${GITHUB_SHA}/README.md"
          echo "Latest:    ${FLY_URL}/public/generic/dummy-app-readme/[LATEST]/README.md"

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages on the first run so the operator
          # doesn't have to flip Settings -> Pages -> Source manually.
          # Relies on the workflow's `pages: write` permission below.
          enablement: true

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEPLOY_TARGET: pages
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Disable Jekyll on output
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
