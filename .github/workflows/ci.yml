name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (standalone)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

  docker-build-push:
    name: Docker build & push (Fly)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Log in to Fly registry with prod-github scoped token
        # Overrides the OIDC-issued docker credential that jfrog/fly-action@v1
        # writes to ~/.docker/config.json so the pull (`FROM` in the build
        # below) and the push run under the narrower scope of the prod-github
        # runtime-environment access token.
        #
        # PROD_DOCKER_USERNAME is the "docker-username" value shown alongside
        # the token in Fly Web's token-creation dialog (stored as a secret so
        # the email/identity stays out of the public workflow YAML). It must
        # match the token's principal exactly — Artifactory returns 401 if
        # they differ.
        env:
          FLY_PROD_GITHUB_TOKEN: ${{ secrets.FLY_PROD_GITHUB_TOKEN }}
          FLY_PROD_GITHUB_USERNAME: ${{ secrets.PROD_DOCKER_USERNAME }}
        run: |
          if [ -z "${FLY_PROD_GITHUB_TOKEN}" ]; then
            echo "::error::FLY_PROD_GITHUB_TOKEN secret is not set on this repo."
            exit 1
          fi
          if [ -z "${FLY_PROD_GITHUB_USERNAME}" ]; then
            echo "::error::PROD_DOCKER_USERNAME secret is not set on this repo."
            exit 1
          fi
          printf '%s' "${FLY_PROD_GITHUB_TOKEN}" | docker login \
            "${FLY_REGISTRY_SUBDOMAIN}" \
            --username "${FLY_PROD_GITHUB_USERNAME}" \
            --password-stdin

      - name: Resolve image tags
        id: tags
        run: |
          # Docker image names must be lowercase; github.repository preserves
          # the owner's case (IgalSidoy/dummy-app -> igalsidoy/dummy-app).
          REPO_LC="${IMAGE_NAME,,}"
          BASE="${FLY_REGISTRY_SUBDOMAIN}/docker/${REPO_LC}"
          echo "latest=${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${BASE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${{ steps.tags.outputs.latest }}" \
            --tag "${{ steps.tags.outputs.sha }}" \
            --build-arg "NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.tags.outputs.latest }}"
          docker push "${{ steps.tags.outputs.sha }}"

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages on the first run so the operator
          # doesn't have to flip Settings -> Pages -> Source manually.
          # Relies on the workflow's `pages: write` permission below.
          enablement: true

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEPLOY_TARGET: pages
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Disable Jekyll on output
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
